name: Browser smoke

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-shell:
    name: Browser smoke / public shell
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.34.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Verify toolchain
        run: |
          node --version
          test "$(node -p 'process.versions.node.split(".")[0]')" = "22"
          pnpm --version
          test "$(pnpm --version)" = "10.34.9"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run public browser smoke
        run: pnpm test:browser-smoke
        env:
          SMOKE_SCREENSHOT_DIR: test-results/browser-smoke-evidence
          SMOKE_EVIDENCE_LABEL: ci-${{ github.sha }}

      - name: Upload representative screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-smoke-${{ github.run_id }}
          path: test-results/browser-smoke-evidence/*.png
          if-no-files-found: error
          retention-days: 7
